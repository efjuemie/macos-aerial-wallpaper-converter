name: Publish v0.8.3 prerelease

on:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: publish-v0.8.3
  cancel-in-progress: false

jobs:
  publish:
    # Only the dedicated release commit may publish v0.8.3. Re-running the
    # same commit is safe because the tag and release are checked first.
    if: >-
      github.event.head_commit != null &&
      startsWith(github.event.head_commit.message, 'Automate v0.8.3 GitHub release')
    runs-on: macos-14
    steps:
      - name: Guard existing prerelease and tag
        id: release_state
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          release_error="$(mktemp)"
          if gh release view v0.8.3 --repo "$GITHUB_REPOSITORY" >/dev/null 2>"$release_error"; then
            echo "release_exists=true" >> "$GITHUB_OUTPUT"
            echo "v0.8.3 release already exists; leaving it unchanged."
            exit 0
          elif ! grep -Eq 'HTTP 404|release not found' "$release_error"; then
            cat "$release_error" >&2
            exit 1
          fi

          tag_error="$(mktemp)"
          if tag_ref="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v0.8.3" --jq '.object.type + "\t" + .object.sha' 2>"$tag_error")"; then
            IFS=$'\t' read -r tag_type tag_object_sha <<< "$tag_ref"
            case "$tag_type" in
              commit)
                tag_target_sha="$tag_object_sha"
                ;;
              tag)
                tag_target="$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$tag_object_sha" --jq '.object.type + "\t" + .object.sha')"
                IFS=$'\t' read -r dereferenced_type tag_target_sha <<< "$tag_target"
                if [ "$dereferenced_type" != "commit" ]; then
                  echo "v0.8.3 tag does not dereference to a commit; refusing to overwrite it." >&2
                  exit 1
                fi
                ;;
              *)
                echo "v0.8.3 tag has an unsupported target type: $tag_type" >&2
                exit 1
                ;;
            esac
            echo "release_exists=false" >> "$GITHUB_OUTPUT"
            echo "tag_exists=true" >> "$GITHUB_OUTPUT"
            if [ "$tag_target_sha" = "$GITHUB_SHA" ]; then
              echo "tag_matches=true" >> "$GITHUB_OUTPUT"
              echo "v0.8.3 tag already points to this release commit; leaving it unchanged."
            else
              echo "tag_conflict=true" >> "$GITHUB_OUTPUT"
              echo "v0.8.3 tag points to $tag_target_sha, not $GITHUB_SHA; refusing to overwrite it."
            fi
          elif grep -q 'HTTP 404' "$tag_error"; then
            echo "release_exists=false" >> "$GITHUB_OUTPUT"
            echo "tag_exists=false" >> "$GITHUB_OUTPUT"
          else
            cat "$tag_error" >&2
            exit 1
          fi

      - name: Stop on an existing tag pointing elsewhere
        if: steps.release_state.outputs.tag_conflict == 'true'
        shell: bash
        run: |
          echo "v0.8.3 already points to another commit; manual review is required." >&2
          exit 1

      - name: Check out release commit
        if: steps.release_state.outputs.release_exists != 'true'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Build arm64 app
        if: steps.release_state.outputs.release_exists != 'true'
        shell: bash
        run: ./build_app.sh

      - name: Verify environment, input, geometry, encoder, and temporal regressions
        if: steps.release_state.outputs.release_exists != 'true'
        shell: bash
        run: |
          set -euo pipefail
          common_sources=(
            Sources/WallpaperConverter/Models.swift
            Sources/WallpaperConverter/Services.swift
            Sources/WallpaperConverter/Infrastructure.swift
            Sources/WallpaperConverter/GeometryDiagnostics.swift
            Sources/WallpaperConverter/EncoderSupport.swift
            Sources/WallpaperConverter/TemporalSampleGroupValidator.swift
          )
          swiftc Sources/WallpaperConverter/InputHandling.swift Scripts/test_input_readiness.swift -o "$RUNNER_TEMP/input-readiness-test"
          "$RUNNER_TEMP/input-readiness-test"
          swiftc "${common_sources[@]}" Sources/WallpaperConverter/EnvironmentRepairService.swift Sources/WallpaperConverter/InputHandling.swift Sources/WallpaperConverter/AppModel.swift Scripts/test_appmodel_input_lifecycle.swift -o "$RUNNER_TEMP/appmodel-input-lifecycle-test"
          "$RUNNER_TEMP/appmodel-input-lifecycle-test"
          swiftc "${common_sources[@]}" Scripts/test_environment_logic.swift -o "$RUNNER_TEMP/environment-test"
          "$RUNNER_TEMP/environment-test"
          swiftc Sources/WallpaperConverter/Models.swift Sources/WallpaperConverter/EncoderSupport.swift Scripts/test_encoder_integrity.swift -o "$RUNNER_TEMP/encoder-test"
          "$RUNNER_TEMP/encoder-test"
          swiftc "${common_sources[@]}" Scripts/test_geometry_logic.swift -o "$RUNNER_TEMP/geometry-test"
          "$RUNNER_TEMP/geometry-test"
          swiftc "${common_sources[@]}" Scripts/test_temporal_sample_groups.swift -o "$RUNNER_TEMP/temporal-test"
          "$RUNNER_TEMP/temporal-test"

      - name: Package and verify release artifacts
        if: steps.release_state.outputs.release_exists != 'true'
        shell: bash
        run: Scripts/package_release.sh

      - name: Create annotated tag
        if: steps.release_state.outputs.release_exists != 'true' && steps.release_state.outputs.tag_exists != 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a v0.8.3 "$GITHUB_SHA" -m "Release v0.8.3"
          git push origin refs/tags/v0.8.3

      - name: Create GitHub prerelease and upload artifacts
        if: steps.release_state.outputs.release_exists != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          notes_file="$(mktemp)"
          awk '
            /^## 0\.8\.3/ { in_section = 1; next }
            in_section && /^## / { exit }
            in_section { print }
          ' CHANGELOG.md > "$notes_file"
          printf '\n%s\n' '运行要求：macOS 13 或更高版本、Apple Silicon（arm64）、至少一个已下载的 Apple 动态壁纸和 1.5 GB 可用磁盘空间。此包是输入就绪状态回归修复预发布版本，使用 ad-hoc 签名，当前未配置 Developer ID 签名或 Apple 公证；请在真机上手动验证输入、目标选择和锁屏→解锁流程。' >> "$notes_file"
          gh release create v0.8.3 \
            "dist/releases/Aerial-Wallpaper-Converter-v0.8.3-Apple-Silicon.dmg" \
            "dist/releases/Aerial-Wallpaper-Converter-v0.8.3-Apple-Silicon.zip" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "Aerial Wallpaper Converter v0.8.3 (Prerelease)" \
            --notes-file "$notes_file" \
            --prerelease
